name: offline_first_cache
description: "An offline-first HTTP client and caching engine for Flutter/Dart with request queuing, GET caching, dead-letter handling, and a Queue Inspector UI."
version: 0.0.10
homepage: https://github.com/TheDanielsdev/offline_first_cache
repository: https://github.com/TheDanielsdev/offline_first_cache
issue_tracker: https://github.com/TheDanielsdev/offline_first_cache/issues

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.0.0
  uuid: ^4.5.2
  flutter_secure_storage: ">=10.0.0 <12.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.1
  hive_test: ^1.0.1
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:

