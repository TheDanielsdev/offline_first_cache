name: offline_first_cache
description: "An offline-first HTTP client for Flutter/Dart with request queuing, GET caching (stale-while-revalidate, tag-based invalidation), and a built-in Queue Inspector UI."
version: 0.0.6
homepage: https://github.com/TheDanielsdev/offline_first_cache
repository: https://github.com/TheDanielsdev/offline_first_cache
issue_tracker: https://github.com/TheDanielsdev/offline_first_cache/issues

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter_skill: ^0.2.6
  flutter:
    sdk: flutter
  hive: ^2.0.0  # Add Hive dependency here if needed
  dio: ^5.0.0   # Example: Add Dio if you're using it
  connectivity_plus: ^7.0.0
  uuid: ^4.5.2
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.0.0  # Add this line
  hive_generator: ^2.0.0  # Add if you're using Hive with code generation
  mockito: ^5.4.4
  hive_test: ^1.0.0
  
  mocktail: ^1.0.4

flutter:
 

